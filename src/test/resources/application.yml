spring:
  application:
    name: epricing-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

server:
  port: 0

epricing:
  temporal:
    enabled: false
  kafka:
    enabled: false
  outbox:
    enabled: false
  migrations:
    seed-demo-data: false
  security:
    enabled: true
    trust-forwarded-headers: false
    client-api-key: "test-client-key-0123456789abcdef"
    operator-api-key: "test-operator-key-0123456789abcdef"
    admin-api-key: "test-admin-key-0123456789abcdef"
  cors:
    allowed-origins: "http://localhost:3000"

kafka:
  enabled: false

otel:
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none

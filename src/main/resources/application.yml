# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  application.yml — Central Configuration for the ePricing Service       ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  WHY THIS FILE EXISTS:                                                   ║
# ║  application.yml is the SINGLE PLACE where you configure your entire    ║
# ║  Spring Boot application. It drives:                                     ║
# ║    - Which port to run on                                                ║
# ║    - Database connection settings                                        ║
# ║    - Which Actuator endpoints to expose                                  ║
# ║    - Micrometer metric labels                                            ║
# ║    - OpenTelemetry endpoint configuration                                ║
# ║    - Log file locations                                                  ║
# ║                                                                          ║
# ║  WHY YAML OVER PROPERTIES:                                               ║
# ║  YAML supports hierarchical structure (nested keys), which maps          ║
# ║  naturally to Spring's configuration hierarchy. It's more readable       ║
# ║  than flat key=value properties for complex configs.                     ║
# ║                                                                          ║
# ║  WITHOUT THIS FILE:                                                      ║
# ║  Spring Boot uses hardcoded defaults. Actuator endpoints would be        ║
# ║  restricted, Prometheus wouldn't work, and the app would be             ║
# ║  impossible to operate in production.                                    ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ═══════════════════════════════════════════════════════════════════
# SPRING CORE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════
spring:
  # Application name — used in:
  #   1. Prometheus labels (job="epricing-service")
  #   2. Grafana dashboard titles
  #   3. Log output (every JSON log line includes application name)
  #   4. OTel service name (if not overridden by env var)
  #   5. /actuator/info response
  application:
    name: epricing-service

  # Active profiles determine which logback-spring.xml <springProfile> block runs
  # Override with: -Dspring.profiles.active=prod (or env var SPRING_PROFILES_ACTIVE=prod)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}

  sql:
    init:
      mode: never

  # ═══════════════════════════════════════════════════════════════
  # ENTERPRISE DISTRIBUTED DATABASE — YugabyteDB (YSQL)
  # ═══════════════════════════════════════════════════════════════
  datasource:
    url: jdbc:yugabytedb://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:epricingdb}?load-balance=true&sslmode=${DB_SSL_MODE:disable}
    driver-class-name: com.yugabyte.Driver
    # Supports DB_USERNAME/DB_PASSWORD or standard SPRING_DATASOURCE_*; no hardcoded default credentials.
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    # HikariCP Connection Pool — Sized above peak Tomcat + Temporal DB concurrency with 10s fail-fast timeout
    hikari:
      pool-name: epricing-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:40}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      validation-timeout: 5000

  # ═══════════════════════════════════════════════════════════════
  # FLYWAY / MIGRATIONS — Enterprise Database Schema Migrations
  # ═══════════════════════════════════════════════════════════════
  flyway:
    enabled: false

  # ═══════════════════════════════════════════════════════════════
  # JPA / HIBERNATE
  # ═══════════════════════════════════════════════════════════════
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # NEVER use 'update' in production — use migrate/validate only
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: ${HIBERNATE_GENERATE_STATISTICS:false}
        jdbc:
          time_zone: UTC
          batch_size: 50
          order_inserts: true
          order_updates: true

  # ═══════════════════════════════════════════════════════════════
  # JACKSON — JSON Serialization
  # ═══════════════════════════════════════════════════════════════
  jackson:
    # ISO 8601 timestamps: "2024-01-15T10:30:00.000+05:30"
    # Better than epoch timestamps for human readability in logs/APIs
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata  # IST for Bank

  # ═══════════════════════════════════════════════════════════════
  # APACHE KAFKA — Event Streaming Platform
  # ═══════════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      default-topic: ${KAFKA_TOPIC_PRICING_EVENTS:${KAFKA_TOPIC:loan-pricing-events}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}

# ═══════════════════════════════════════════════════════════════════
# SERVER CONFIGURATION
# ═══════════════════════════════════════════════════════════════════
server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:50}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:8}
    accept-count: 100
    max-connections: 8192
  # Context path: all endpoints start with /api/v1
  # e.g., /api/v1/pricing instead of /pricing
  # Versioning is critical in banking APIs — clients depend on stable contracts
  servlet:
    context-path: /api/v1
  # HTTP error response format
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never  # NEVER expose stack traces to clients in production

# ═══════════════════════════════════════════════════════════════════
# ACTUATOR — The Observability Foundation
# ═══════════════════════════════════════════════════════════════════
management:
  # Run Actuator on a SEPARATE port (8081) in production.
  # This port is NOT exposed to the internet — only to your monitoring network.
  # Prometheus, Grafana, and ops tools access port 8081.
  # Clients access your API on port 8080.
  # This is critical for security — you don't want the world hitting /actuator/heapdump
  server:
    port: 8081

  endpoints:
    web:
      # Actuator base path (accessible on port 8081)
      base-path: /actuator
      exposure:
        # EXPLICITLY list which endpoints to expose.
        # NEVER use include: "*" in production without understanding each endpoint.
        # Exposed:
        #   health     → Is the app alive? Used by load balancers, k8s liveness probes
        #   info       → Version, git commit, build time
        #   prometheus → Metrics for Prometheus to scrape (THE most important one)
        #   metrics    → Human-readable metrics (for debugging)
        #
        # REMOVED from exposure (compliance hardening):
        #   env        → Would expose ALL config values including DB credentials
        #   configprops → Would expose all Spring config including secrets
        #   threaddump → Exposes internal thread/memory state
        #   beans      → Exposes Spring bean wiring internals
        #   conditions → Exposes internal auto-configuration decisions
        #   loggers    → Allows runtime log-level changes without deploy (keep for prod-ops only)
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
      # Health groups let you create custom health checks for different purposes.
      # liveness: Is the app running? (Kubernetes restarts it if not)
      # readiness: Is the app ready to receive traffic? (K8s removes from load balancer if not)
      group:
        liveness:
          include: livenessState, ping
        readiness:
          include: readinessState, db, diskSpace

  # ═══════════════════════════════════════════════════════════════
  # METRICS — Micrometer Configuration
  # ═══════════════════════════════════════════════════════════════
  metrics:
    # Common tags added to ALL metrics automatically.
    # These appear as labels in Prometheus:
    # http_server_requests_seconds_count{application="epricing-service",team="epricing",region="india",...}
    #
    # WHY TAGS MATTER:
    # When you run 5 instances of this service, Prometheus collects metrics
    # from all 5. Tags like "instance" and "application" let you:
    #   - Sum across instances: sum(http_requests_total{application="epricing-service"})
    #   - Compare instances: http_requests_total{instance="pod-1"} vs {instance="pod-2"}
    tags:
      application: ${spring.application.name}
      team: epricing
      region: india
      environment: ${spring.profiles.active}
    distribution:
      # Percentile histograms are needed for p95, p99 latency in Grafana.
      # Without this, you can only see average latency.
      # p95 = 95% of requests completed within this time
      # p99 = 99% of requests completed within this time
      # These are critical SLOs (Service Level Objectives) in banking.
      percentiles-histogram:
        http.server.requests: true  # Enable for HTTP endpoint latency
        pricing.calculation.duration: true  # Enable for our custom metric
      # Publish these specific percentiles
      percentiles:
        http.server.requests: 0.5, 0.75, 0.90, 0.95, 0.99
        pricing.calculation.duration: 0.5, 0.90, 0.95, 0.99
      # SLA (Service Level Agreement) buckets — count requests above these thresholds
      # Used in Grafana to show "% of requests under 200ms"
      sla:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s

# ═══════════════════════════════════════════════════════════════════
# LOGGING — File Location (read by logback-spring.xml)
# ═══════════════════════════════════════════════════════════════════
logging:
  file:
    # Promtail is configured to read from this directory
    # In Docker Compose, this maps to /app/logs; in Kubernetes, /var/log/epricing
    path: ${LOGGING_FILE_PATH:./logs}
  level:
    root: INFO
    com.bank: DEBUG  # Verbose for our own code
    org.springframework.web: INFO
    org.hibernate: WARN

# ═══════════════════════════════════════════════════════════════════
# OPENTELEMETRY SDK CONFIGURATION
# Telemetry is initialized programmatically in OpenTelemetryConfig.java
# using the OpenTelemetry SDK AutoConfigure extension.
# ═══════════════════════════════════════════════════════════════════
otel:
  service:
    name: ${spring.application.name}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf
  resource:
    attributes:
      service.name: ${spring.application.name}
      service.version: 1.0.0
      deployment.environment: ${spring.profiles.active}
      service.namespace: Bank
      team.name: epricing

# ═══════════════════════════════════════════════════════════════════
# APPLICATION-SPECIFIC CONFIGURATION
# ═══════════════════════════════════════════════════════════════════
epricing:
  # Business configuration
  pricing:
    # Base rate used in pricing calculation
    base-rate: 8.5
    # Risk multiplier for different loan types
    risk-multiplier:
      home-loan: 1.00
      auto-loan: 1.10
      business-loan: 1.30
      personal-loan: 1.50
      education-loan: 1.05
  # CORS allowed origins — MUST be set via CORS_ALLOWED_ORIGINS env var in all environments.
  # No wildcard default. If not set, CORS is denied for all cross-origin requests.
  # Example: CORS_ALLOWED_ORIGINS=https://grafana.bank.com,https://portal.bank.com
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Rate validity period — number of days the quoted rate is valid
  # Supports EPRICING_RATE_VALID_DAYS (k8s ConfigMap) and RATE_VALID_DAYS
  rate-valid-days: ${EPRICING_RATE_VALID_DAYS:${RATE_VALID_DAYS:7}}

  migrations:
    seed-demo-data: ${EPRICING_SEED_DEMO_DATA:false}
    grafana-reader-password: ${GRAFANA_READER_PASSWORD:}

  database:
    lock-timeout-ms: ${DB_LOCK_TIMEOUT_MS:5000}
    statement-timeout-ms: ${DB_STATEMENT_TIMEOUT_MS:15000}

  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
    send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:5}
    max-retries: ${OUTBOX_MAX_RETRIES:10}

  security:
    enabled: ${SECURITY_ENABLED:true}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    client-api-key: ${EPRICING_CLIENT_API_KEY:}
    operator-api-key: ${EPRICING_OPERATOR_API_KEY:}
    admin-api-key: ${EPRICING_ADMIN_API_KEY:}

  health:
    expose-details: ${HEALTH_EXPOSE_DETAILS:false}

  # Rolling log policy bounds (read by logback-spring.xml via <springProperty>)
  logging:
    max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
    max-history: ${LOG_MAX_HISTORY:30}
    total-size-cap: ${LOG_TOTAL_SIZE_CAP:3GB}

  # ═══════════════════════════════════════════════════════════════
  # TEMPORAL — Durable Workflow Orchestration
  # ═══════════════════════════════════════════════════════════════
  temporal:
    enabled: ${TEMPORAL_ENABLED:false}
    target: ${TEMPORAL_TARGET:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    task-queue: ${TEMPORAL_TASK_QUEUE:epricing-pricing-queue}
    worker:
      max-concurrent-workflow-tasks: ${TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASKS:25}
      max-concurrent-activities: ${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:25}
      max-concurrent-local-activities: ${TEMPORAL_MAX_CONCURRENT_LOCAL_ACTIVITIES:10}
      workflow-task-pollers: ${TEMPORAL_WORKFLOW_TASK_POLLERS:2}
      activity-task-pollers: ${TEMPORAL_ACTIVITY_TASK_POLLERS:2}
      max-workflow-threads: ${TEMPORAL_MAX_WORKFLOW_THREADS:50}
      workflow-cache-size: ${TEMPORAL_WORKFLOW_CACHE_SIZE:200}

  # ═══════════════════════════════════════════════════════════════
  # KAFKA EVENT STREAMING
  # ═══════════════════════════════════════════════════════════════
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topic: ${KAFKA_TOPIC_PRICING_EVENTS:${KAFKA_TOPIC:loan-pricing-events}}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}
    min-insync-replicas: ${KAFKA_MIN_INSYNC_REPLICAS:1}

# ═══════════════════════════════════════════════════════════════════
# KAFKA TOP-LEVEL FEATURE FLAG & TOPIC CONFIGURATION
# ═══════════════════════════════════════════════════════════════════
kafka:
  enabled: ${KAFKA_ENABLED:true}
  topic: ${KAFKA_TOPIC_PRICING_EVENTS:${KAFKA_TOPIC:loan-pricing-events}}

---
# ═══════════════════════════════════════════════════════════════════
# IN-MEMORY PROFILE FOR LOCAL STANDALONE RUNS (NO DOCKER NEEDED)
# ═══════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:epricingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false  # Explicitly disabled — never expose H2 console outside local dev

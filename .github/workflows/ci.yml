name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js for Showcase Validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Showcase Inline Script Syntax
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("showcase/index.html", "utf8");
            const match = html.match(/<script>([\s\S]*?)<\/script>\s*<\/body>/);
            if (!match) throw new Error("Missing main showcase script block");
            new Function(match[1]);
            console.log("Showcase JS syntax valid (" + match[1].length + " chars)");
          '

      - name: Build and Test with Maven
        run: mvn -B clean verify

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: epricing-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

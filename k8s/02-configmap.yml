# ═══════════════════════════════════════════════════════════════════════════
# 02-configmap.yml — Enterprise ePricing Application Configuration
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: epricing-config
  namespace: epricing
  labels:
    app.kubernetes.io/name: epricing-service
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: bank-digital-onboarding
data:
  # Spring runtime profile
  SPRING_PROFILES_ACTIVE: "k8s"

  # Server ports (split business vs management traffic) & graceful shutdown
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "8081"
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "25s"

  # Database configuration (YugabyteDB / PostgreSQL with TLS verification)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://yugabyte-ysql.database.svc.cluster.local:5433/epricingdb?sslmode=verify-full"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_FLYWAY_ENABLED: "false"
  EPRICING_SEED_DEMO_DATA: "false"

  # Temporal durable workflow orchestration
  TEMPORAL_ENABLED: "true"
  TEMPORAL_TARGET: "temporal-frontend.temporal.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "epricing-pricing-queue"

  # OpenTelemetry distributed tracing and metrics
  OTEL_SERVICE_NAME: "epricing-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"

  # Kafka domain event streaming
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.streaming.svc.cluster.local:9092"
  KAFKA_TOPIC: "loan-pricing-events"
  KAFKA_TOPIC_PARTITIONS: "3"
  KAFKA_TOPIC_REPLICAS: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"

  # Core pricing domain business parameters (Spring relaxed binding -> epricing.pricing.base-rate)
  EPRICING_PRICING_BASE_RATE: "8.50"
  EPRICING_RATE_VALID_DAYS: "7"

  # Logging & Auditing (matches writable emptyDir mount at /var/log/epricing with 512Mi sizeLimit)
  LOGGING_FILE_PATH: "/var/log/epricing"
  LOG_MAX_FILE_SIZE: "50MB"
  LOG_MAX_HISTORY: "5"
  LOG_TOTAL_SIZE_CAP: "256MB"
  LOGGING_LEVEL_COM_BANK_EPRICING: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: "WARN"

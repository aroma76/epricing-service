# ═══════════════════════════════════════════════════════════════════════════
# 08-networkpolicy.yml — Zero-Trust Cloud-Agnostic NetworkPolicy
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: epricing-service-netpol
  namespace: epricing
  labels:
    app.kubernetes.io/name: epricing-service
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: bank-digital-onboarding
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: epricing-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Business REST API (port 8080) allowed only from API gateway / ingress namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 8080
    # Management / Actuator probes & Prometheus scrape (port 8081) restricted to monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # Cluster DNS resolution (CoreDNS / kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # YugabyteDB YSQL (database namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5433
    # Kafka KRaft brokers (streaming namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: streaming
      ports:
        - protocol: TCP
          port: 9092
    # Temporal frontend gRPC (temporal namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: temporal
      ports:
        - protocol: TCP
          port: 7233
    # OpenTelemetry Collector OTLP HTTP (monitoring namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318

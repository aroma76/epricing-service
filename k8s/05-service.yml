# ═══════════════════════════════════════════════════════════════════════════
# 05-service.yml — Internal Cluster Routing Service
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: epricing-service
  namespace: epricing
  labels:
    app.kubernetes.io/name: epricing-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: bank-digital-onboarding
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: epricing-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP

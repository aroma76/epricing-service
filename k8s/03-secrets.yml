# ═══════════════════════════════════════════════════════════════════════════
# 03-secrets.yml — Database and Cryptographic Secrets Template
# ═══════════════════════════════════════════════════════════════════════════
# In production, values are provisioned via HashiCorp Vault, AWS Secrets Manager,
# or External Secrets Operator (ESO). Below is the declarative base secret.
apiVersion: v1
kind: Secret
metadata:
  name: epricing-secrets
  namespace: epricing
  labels:
    app.kubernetes.io/name: epricing-service
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: bank-digital-onboarding
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "epricing_app"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
